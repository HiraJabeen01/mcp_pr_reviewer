[project]
name = "pr-assistant"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "openai",
  "pydantic-settings",
  "loguru",
]

[dependency-groups]
dev = [
  "httpx",
  "mypy",
  "pytest",
  "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
